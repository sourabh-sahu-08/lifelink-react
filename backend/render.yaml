services:
  - type: web
    name: lifelink-backend
    env: node
    plan: free
    repo: https://github.com/sourabh-sahu-08/lifelink-react
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
